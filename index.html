<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
</head>
<!-- banner -->

<body class="open-sans-uniquifier">
  <header class="main-header">
    <nav class="top-header">
      <p class="logo">logo</p>
      <button class="btn-signup">Sign Up</button>
    </nav>
    <div class="hero">
      <h1>Cool Dark UI Template for Webflow Agencies!</h1>
      <button class="btn-signup">Stay Focused</button>
    </div>
    <!-- first  -->
    <section>
      <div class="content">
        <div class="text-contener">
          <h2 class="heading">See It in Action</h2>
          <p class="pading">Explore the live preview and imagine your brand in this bold new look.</p>
          <button class="btn-signup">Launch Live Preview</button>
        </div>
        <img class="img-png" src="Assets/wc-big.png" alt="">
      </div>
    </section>
    <!-- Third -->
    <section class="stats-asction">
      <div class="container">
        <h2 class="stats-heading">Joined Thousands of Productive Users</h2>

        <div class="stats-cards">
          <div class="stats-tiem">
            <h3 class="stast-numbar">50K</h3>
            <p class="stast-label">Active Users</p>
          </div>

          <div class="stats-tiem">
            <h3 class="stast-numbar">2M+</h3>
            <p class="stast-label">Focus Sessions</p>
          </div>

          <div class="stats-tiem">
            <h3 class="stast-numbar">95%</h3>
            <p class="stast-label">Satisfaction Rate</p>
          </div>
        </div>
      </div>
    </section>

  </header>

</body>

</html>
